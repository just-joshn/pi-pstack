name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # `bun fmt` output depends on the Bun release, so CI uses the release the files were formatted with.
  BUN_VERSION: 1.4.5

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
      - name: Use Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check types
        run: bun run typecheck
      - name: Check generated files
        run: python3 scripts/generate.py --check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the oldest release that `engines` in package.json allows.
        node-version: ["22.19.0", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Use Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the tests with the coverage gate
        run: bun run test:coverage
      - name: Run the smoke test on real Pi
        run: node scripts/smoke.ts
        env:
          PSTACK_PI_BIN: ${{ github.workspace }}/node_modules/.bin/pi
