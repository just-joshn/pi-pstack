name: Stage npm package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in package.json on main
        required: true
        type: string
      backfill:
        description: Use the backfill dist-tag instead of latest for an older release
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  eligible:
    name: Check release version
    if: github.repository == 'just-joshn/pi-pstack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stage: ${{ steps.gate.outputs.stage }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare versions
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          EXPECTED_VERSION: ${{ inputs.version }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          version_filter='.version | strings | select(test("^(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)){2}$"))'
          version=$(jq -er "$version_filter" package.json)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$version" != "$EXPECTED_VERSION" ]]; then
              echo '::error::The requested version does not match package.json on main.'
              exit 1
            fi
            if [[ "$BACKFILL" == true ]]; then
              echo 'tag=backfill' >> "$GITHUB_OUTPUT"
            fi
          else
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            previous=$(git show "$BEFORE:package.json" | jq -er "$version_filter")
            if [[ "$version" == "$previous" || "$version" != "$(printf '%s\n' "$version" "$previous" | sort -V | tail -n 1)" ]]; then
              exit 0
            fi
          fi
          echo 'stage=true' >> "$GITHUB_OUTPUT"

  verify:
    name: Verify and pack
    needs: eligible
    if: needs.eligible.outputs.stage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
          no-cache: true
      - name: Validate registry identity
        run: |
          jq -e '.name == "pi-pstack-workflow-kit" and
            .repository.url == "git+https://github.com/just-joshn/pi-pstack.git" and
            .packageManager == "npm@11.20.0"' package.json
      - name: Check npm and install dependencies
        run: |
          test "$(npm --version)" = '11.20.0'
          npm ci --ignore-scripts --include=dev --no-audit
      - name: Check, test, audit, and inspect the package
        run: |
          npm run check
          npm --prefix src/skills/statechart/scripts run test:coverage
          npm run test:coverage
          npm run audit
          npm run pack:check
      - name: Test bundled watch-pr
        working-directory: src/skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
          bun run test
      - name: Scan history
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/path \
            -v "$PWD:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --ignore-gitleaks-allow --log-opts="--all" /path
      - name: Pack once and load on both supported Pi versions
        id: pack
        run: |
          changes=$(git status --porcelain)
          if [[ -n "$changes" ]]; then
            echo '::error::Verification changed the checkout. Refusing to pack.'
            printf '%s\n' "$changes"
            exit 1
          fi
          npm run test:package -- --tarball-out "$RUNNER_TEMP/release.tgz" 1.6.0 1.6.1
          sha256=$(sha256sum "$RUNNER_TEMP/release.tgz" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: verified-npm-tarball-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  stage:
    name: Stage verified tarball
    needs: [eligible, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    env:
      NPM_CONFIG_USERCONFIG: /dev/null
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Check npm version
        run: test "$(npm --version)" = '11.20.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: Stage on npm
        env:
          SHA256: ${{ needs.verify.outputs.sha256 }}
          DIST_TAG: ${{ needs.eligible.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP"
          printf '%s  release.tgz\n' "$SHA256" | sha256sum --check --strict
          set --
          if [[ "$DIST_TAG" == backfill ]]; then
            set -- --tag backfill
          fi
          npm stage publish ./release.tgz --ignore-scripts --registry=https://registry.npmjs.org/ "$@"
