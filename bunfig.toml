[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
trailingComma = "all"
bracketSpacing = true
arrowParens = "always"
endOfLine = "lf"
quoteProps = "as-needed"
proseWrap = "preserve"

sortPackageJson = true
sortTailwindcss = false

ignorePatterns = [
  "dist/",
  "build/",
  "coverage/",
  "src/skills/*/scripts/",
  # Files ported by hand from upstream keep upstream's Markdown exactly.
  "src/skills/**/*.md",
  "src/docs/",
  "src/automations/",
  # Upstream's PR review canvas assets ship byte for byte.
  "src/skills/pr-review-canvas/",
]

[fmt.sortImports]
groups = [
  "builtin",
  "external",
  ["internal", "subpath"],
  ["parent", "sibling", "index"],
  "style",
  "unknown",
]
order = "asc"
ignoreCase = true
newlinesBetween = true
sortSideEffects = false
